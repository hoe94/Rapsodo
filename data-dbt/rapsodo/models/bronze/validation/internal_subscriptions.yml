version: 2

sources:
  - name: internal_subscriptions
    database: rapsodo_db
    schema: bronze_rapsodo
    tables:
      - name: internal_subscriptions
        columns:
          - name: user_id
            data_type: varchar
            tests:
              - not_null
              - unique
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  arguments:
                    min_value: 0
                    max_value: 5

          - name: plan
            data_type: varchar
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['PRO_ANNUAL', 'PRO_MONTHLY', 'TRIAL', 'BASIC_MONTHLY']

          - name: status
            data_type: varchar
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['active', 'trial', 'canceled']

          - name: start_date
            data_type: varchar
            tests:
              - not_null
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  arguments:
                    min_value: 0
                    max_value: 10

          - name: end_date
            data_type: varchar
            tests:
              - not_null
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  arguments:
                    min_value: 0
                    max_value: 10

          - name: last_updated
            data_type: varchar
            tests:
              - not_null